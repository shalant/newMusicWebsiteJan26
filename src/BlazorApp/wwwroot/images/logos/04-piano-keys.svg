<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" width="420" height="170">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;300;400&display=swap');
  </style>

  <!-- Background -->
  <rect width="420" height="170" fill="#060f1e"/>

  <!-- Piano keys — centered, one octave C to B (7 white keys) -->
  <!-- White keys: 22px wide, 2px gap, 46px tall. Total = 7*24-2 = 166px. Offset x = (420-166)/2 = 127 -->
  <g transform="translate(127, 14)">

    <!-- White keys -->
    <rect x="0"   y="0" width="22" height="46" fill="#d8eeff" rx="1.5"/>
    <rect x="24"  y="0" width="22" height="46" fill="#d8eeff" rx="1.5"/>
    <rect x="48"  y="0" width="22" height="46" fill="#d8eeff" rx="1.5"/>
    <rect x="72"  y="0" width="22" height="46" fill="#d8eeff" rx="1.5"/>
    <rect x="96"  y="0" width="22" height="46" fill="#d8eeff" rx="1.5"/>
    <rect x="120" y="0" width="22" height="46" fill="#d8eeff" rx="1.5"/>
    <rect x="144" y="0" width="22" height="46" fill="#d8eeff" rx="1.5"/>

    <!-- Black keys (no key between E-F and B-C) -->
    <!-- C# -->
    <rect x="15"  y="0" width="14" height="29" fill="#060f1e" rx="1"/>
    <!-- D# -->
    <rect x="39"  y="0" width="14" height="29" fill="#060f1e" rx="1"/>
    <!-- F# -->
    <rect x="87"  y="0" width="14" height="29" fill="#060f1e" rx="1"/>
    <!-- G# -->
    <rect x="111" y="0" width="14" height="29" fill="#060f1e" rx="1"/>
    <!-- A# -->
    <rect x="135" y="0" width="14" height="29" fill="#060f1e" rx="1"/>

    <!-- Accent line below keys -->
    <line x1="-8" y1="50" x2="174" y2="50" stroke="#4db8ff" stroke-width="0.8"/>
  </g>

  <!-- Name -->
  <text
    x="210" y="104"
    font-family="'Josefin Sans', sans-serif"
    font-size="30"
    font-weight="300"
    letter-spacing="9"
    text-anchor="middle"
    fill="#d8eeff">ROSENBERG</text>

  <!-- Rule -->
  <line x1="90" y1="116" x2="330" y2="116" stroke="#4db8ff" stroke-width="0.6" opacity="0.5"/>

  <!-- Tagline -->
  <text
    x="210" y="140"
    font-family="'Josefin Sans', sans-serif"
    font-size="10"
    font-weight="200"
    letter-spacing="5"
    text-anchor="middle"
    fill="#4db8ff"
    opacity="0.7">DOUG  ·  SAXOPHONE  ·  JAZZ</text>
</svg>
