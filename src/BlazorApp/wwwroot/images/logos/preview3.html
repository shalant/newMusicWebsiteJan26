<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Logo Prototypes — Batch 3 — Doug Rosenberg</title>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #03080f; font-family: 'Josefin Sans', sans-serif; padding: 3rem 2rem 5rem; color: #88b8d8; }
    nav { text-align: center; margin-bottom: 2rem; display: flex; justify-content: center; gap: 2rem; }
    nav a { color: #4db8ff; font-size: 0.65rem; letter-spacing: 4px; text-transform: uppercase; text-decoration: none; opacity: 0.55; }
    nav a:hover { opacity: 1; }
    h1 { text-align: center; font-size: 0.75rem; font-weight: 200; letter-spacing: 6px; text-transform: uppercase; color: #4db8ff; opacity: 0.6; margin-bottom: 3.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 2rem; max-width: 1100px; margin: 0 auto; }
    .card { background: #060f1e; border: 1px solid rgba(77,184,255,0.12); border-radius: 6px; padding: 3rem 2.5rem; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
    .card-label { font-size: 0.6rem; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; color: #4db8ff; opacity: 0.45; }
    svg text { font-family: 'Josefin Sans', sans-serif; }
  </style>
</head>
<body>

  <nav>
    <a href="preview.html">← Batch 1</a>
    <a href="preview2.html">← Batch 2</a>
    <a href="preview4.html">Batch 4 →</a>
  </nav>
  <h1>Logo Prototypes · Batch 3</h1>

  <div class="grid">


    <!-- ─────────────────────────────────────── -->
    <!-- 11  W E I G H T  C O N T R A S T       -->
    <!--     DOUG (thin) + ROSENBERG (medium)   -->
    <!--     single full-width rule below       -->
    <!-- ─────────────────────────────────────── -->
    <div class="card">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 82" width="400" height="82">
        <text x="200" y="44" font-size="30" text-anchor="middle" letter-spacing="8" fill="#d8eeff">
          <tspan font-weight="100">DOUG</tspan><tspan font-weight="300"> ROSENBERG</tspan>
        </text>
        <line x1="18" y1="58" x2="382" y2="58" stroke="#4db8ff" stroke-width="0.85"/>
      </svg>
      <span class="card-label">11 — Weight contrast + rule</span>
    </div>


    <!-- ─────────────────────────────────────── -->
    <!-- 12  S T A C K E D                      -->
    <!--     DOUG small + thin above            -->
    <!--     ROSENBERG large below              -->
    <!--     short centered accent rule between -->
    <!-- ─────────────────────────────────────── -->
    <div class="card">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 118" width="320" height="118">
        <text x="160" y="38" font-size="17" font-weight="100" letter-spacing="18"
              text-anchor="middle" fill="#d8eeff">DOUG</text>
        <line x1="134" y1="50" x2="186" y2="50" stroke="#4db8ff" stroke-width="0.9"/>
        <text x="160" y="96" font-size="40" font-weight="300" letter-spacing="4"
              text-anchor="middle" fill="#d8eeff">ROSENBERG</text>
      </svg>
      <span class="card-label">12 — Stacked weights</span>
    </div>


    <!-- ─────────────────────────────────────── -->
    <!-- 13  D I A M O N D   S E P A R A T O R  -->
    <!--     DOUG ◆ ROSENBERG on one line       -->
    <!--     diamond in accent blue             -->
    <!-- ─────────────────────────────────────── -->
    <div class="card">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 76" width="420" height="76">
        <!-- DOUG right-aligned to the diamond -->
        <text x="192" y="44" font-size="24" font-weight="200" letter-spacing="7"
              text-anchor="end" fill="#d8eeff">DOUG</text>
        <!-- Diamond mark -->
        <polygon points="210,35 217,43 210,51 203,43" fill="#4db8ff"/>
        <!-- ROSENBERG left-aligned from diamond -->
        <text x="228" y="44" font-size="24" font-weight="200" letter-spacing="7"
              text-anchor="start" fill="#d8eeff">ROSENBERG</text>
      </svg>
      <span class="card-label">13 — Diamond separator</span>
    </div>


    <!-- ─────────────────────────────────────── -->
    <!-- 14  T W O - C O L O R                  -->
    <!--     DOUG in accent blue                -->
    <!--     ROSENBERG in near-white            -->
    <!--     same line, same size, weight shift -->
    <!-- ─────────────────────────────────────── -->
    <div class="card">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 76" width="400" height="76">
        <text x="200" y="44" font-size="28" text-anchor="middle" letter-spacing="7">
          <tspan font-weight="100" fill="#4db8ff">DOUG</tspan>
          <tspan font-weight="300" fill="#d8eeff"> ROSENBERG</tspan>
        </text>
      </svg>
      <span class="card-label">14 — Two-color name</span>
    </div>


    <!-- ─────────────────────────────────────── -->
    <!-- 15  C O R N E R   F R A M E            -->
    <!--     two diagonal corner brackets       -->
    <!--     name centered between them         -->
    <!-- ─────────────────────────────────────── -->
    <div class="card">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 108" width="360" height="108">
        <!-- top-left corner — double barline bracket (outer L + inner L) -->
        <polyline points="20,48 20,16 52,16"
                  fill="none" stroke="#4db8ff" stroke-width="1.5" stroke-linecap="square"/>
        <polyline points="26,48 26,22 52,22"
                  fill="none" stroke="#4db8ff" stroke-width="1.5" stroke-linecap="square"/>

        <!-- bottom-right corner — mirrored double barline bracket -->
        <polyline points="340,60 340,92 308,92"
                  fill="none" stroke="#4db8ff" stroke-width="1.5" stroke-linecap="square"/>
        <polyline points="334,60 334,86 308,86"
                  fill="none" stroke="#4db8ff" stroke-width="1.5" stroke-linecap="square"/>

        <!-- name centered -->
        <text x="180" y="60" font-size="26" font-weight="200" letter-spacing="9"
              text-anchor="middle" fill="#d8eeff">DOUG ROSENBERG</text>
      </svg>
      <span class="card-label">15 — Double barline corners</span>
    </div>


  </div>
</body>
</html>
