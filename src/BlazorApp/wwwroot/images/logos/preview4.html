<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Logo Prototypes — Batch 4 — Doug Rosenberg</title>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #03080f; font-family: 'Josefin Sans', sans-serif; padding: 3rem 2rem 5rem; color: #88b8d8; }
    nav { text-align: center; margin-bottom: 2rem; display: flex; justify-content: center; gap: 2rem; }
    nav a { color: #4db8ff; font-size: 0.65rem; letter-spacing: 4px; text-transform: uppercase; text-decoration: none; opacity: 0.55; }
    nav a:hover { opacity: 1; }
    h1 { text-align: center; font-size: 0.75rem; font-weight: 200; letter-spacing: 6px; text-transform: uppercase; color: #4db8ff; opacity: 0.6; margin-bottom: 3.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 2.5rem; max-width: 1100px; margin: 0 auto; }
    .card { background: #060f1e; border: 1px solid rgba(77,184,255,0.12); border-radius: 6px; padding: 3.5rem 2.5rem; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
    .card-label { font-size: 0.6rem; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; color: #4db8ff; opacity: 0.45; }
    svg text { font-family: 'Josefin Sans', sans-serif; }
  </style>
</head>
<body>

  <nav>
    <a href="preview3.html">← Batch 3</a>
    <a href="preview5.html">Batch 5 →</a>
    <a href="preview6.html">Batch 6 →</a>
  </nav>
  <h1>Logo Prototypes · Batch 4 · #15 Variations</h1>

  <div class="grid">


    <!-- ──────────────────────────────────────────── -->
    <!-- 16  R E P E A T   B R A C K E T S           -->
    <!--     double-L corners + two dots inside      -->
    <!--     references :||: repeat sign             -->
    <!-- ──────────────────────────────────────────── -->
    <div class="card">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 108" width="360" height="108">

        <!-- top-left: outer L -->
        <polyline points="20,48 20,16 52,16"
                  fill="none" stroke="#4db8ff" stroke-width="1.5" stroke-linecap="square"/>
        <!-- top-left: inner L -->
        <polyline points="26,48 26,22 52,22"
                  fill="none" stroke="#4db8ff" stroke-width="1.5" stroke-linecap="square"/>
        <!-- repeat dots — inside the corner, between the two L arms -->
        <circle cx="37" cy="30" r="2.6" fill="#4db8ff"/>
        <circle cx="37" cy="40" r="2.6" fill="#4db8ff"/>

        <!-- bottom-right: outer L -->
        <polyline points="340,60 340,92 308,92"
                  fill="none" stroke="#4db8ff" stroke-width="1.5" stroke-linecap="square"/>
        <!-- bottom-right: inner L -->
        <polyline points="334,60 334,86 308,86"
                  fill="none" stroke="#4db8ff" stroke-width="1.5" stroke-linecap="square"/>
        <!-- repeat dots -->
        <circle cx="323" cy="68" r="2.6" fill="#4db8ff"/>
        <circle cx="323" cy="78" r="2.6" fill="#4db8ff"/>

        <text x="180" y="60" font-size="26" font-weight="200" letter-spacing="9"
              text-anchor="middle" fill="#d8eeff">DOUG ROSENBERG</text>
      </svg>
      <span class="card-label">16 — Repeat sign corners</span>
    </div>


    <!-- ──────────────────────────────────────────── -->
    <!-- 17  A C C I D E N T A L S                   -->
    <!--     ♯ sharp top-left, ♭ flat bottom-right   -->
    <!--     no bracket — symbols carry the framing  -->
    <!-- ──────────────────────────────────────────── -->
    <div class="card">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 108" width="360" height="108">

        <!-- Sharp ♯ — top-left                      -->
        <!-- two vertical lines -->
        <line x1="20" y1="16" x2="20" y2="48" stroke="#4db8ff" stroke-width="1.4"/>
        <line x1="28" y1="16" x2="28" y2="48" stroke="#4db8ff" stroke-width="1.4"/>
        <!-- two horizontal crossbars (classic slight angle) -->
        <line x1="14" y1="26" x2="34" y2="22" stroke="#4db8ff" stroke-width="2.2" stroke-linecap="square"/>
        <line x1="14" y1="38" x2="34" y2="34" stroke="#4db8ff" stroke-width="2.2" stroke-linecap="square"/>

        <!-- Flat ♭ — bottom-right                   -->
        <!-- vertical stem -->
        <line x1="332" y1="60" x2="332" y2="94"
              stroke="#4db8ff" stroke-width="1.5" stroke-linecap="round"/>
        <!-- rounded bulge to the left (filled teardrop) -->
        <path d="M 332,73 C 344,71 348,78 346,83 C 344,89 332,90 332,88 Z"
              fill="#4db8ff"/>

        <text x="180" y="60" font-size="26" font-weight="200" letter-spacing="9"
              text-anchor="middle" fill="#d8eeff">DOUG ROSENBERG</text>
      </svg>
      <span class="card-label">17 — Sharp &amp; flat</span>
    </div>


    <!-- ──────────────────────────────────────────── -->
    <!-- 18  Q U A R T E R   N O T E S               -->
    <!--     filled note head + stem at each corner  -->
    <!--     top-left stem up, bottom-right stem down-->
    <!-- ──────────────────────────────────────────── -->
    <div class="card">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 108" width="360" height="108">

        <!-- top-left note — stem up -->
        <ellipse cx="24" cy="46" rx="10" ry="7.5"
                 transform="rotate(-18, 24, 46)" fill="#4db8ff"/>
        <line x1="33" y1="41" x2="33" y2="12"
              stroke="#4db8ff" stroke-width="2" stroke-linecap="round"/>

        <!-- bottom-right note — stem down, mirrored -->
        <ellipse cx="336" cy="62" rx="10" ry="7.5"
                 transform="rotate(-18, 336, 62)" fill="#4db8ff"/>
        <line x1="327" y1="67" x2="327" y2="96"
              stroke="#4db8ff" stroke-width="2" stroke-linecap="round"/>

        <text x="180" y="60" font-size="26" font-weight="200" letter-spacing="9"
              text-anchor="middle" fill="#d8eeff">DOUG ROSENBERG</text>
      </svg>
      <span class="card-label">18 — Quarter note corners</span>
    </div>


    <!-- ──────────────────────────────────────────── -->
    <!-- 19  C L E F S                               -->
    <!--     treble clef top-left                    -->
    <!--     bass clef bottom-right                  -->
    <!-- ──────────────────────────────────────────── -->
    <div class="card">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 108" width="360" height="108">

        <!-- Treble clef — top-left (simplified path) -->
        <!-- spine -->
        <line x1="24" y1="14" x2="24" y2="52"
              stroke="#4db8ff" stroke-width="1.5" stroke-linecap="round"/>
        <!-- top curl: up and around to the right -->
        <path d="M 24,16 C 32,10 38,18 34,26 C 30,30 24,28 24,24"
              fill="none" stroke="#4db8ff" stroke-width="1.4" stroke-linecap="round"/>
        <!-- middle loop: oval circling the G line (~y=38) -->
        <path d="M 24,32 C 34,30 38,36 36,42 C 34,48 24,48 22,44 C 20,40 22,34 24,32"
              fill="none" stroke="#4db8ff" stroke-width="1.4" stroke-linecap="round"/>
        <!-- bottom tail -->
        <path d="M 24,52 C 16,56 14,50 16,46"
              fill="none" stroke="#4db8ff" stroke-width="1.3" stroke-linecap="round"/>

        <!-- Bass clef — bottom-right -->
        <!-- C-curve body -->
        <path d="M 340,66 C 326,62 320,72 322,80 C 324,89 336,92 342,86"
              fill="none" stroke="#4db8ff" stroke-width="1.7" stroke-linecap="round"/>
        <!-- two dots -->
        <circle cx="347" cy="70" r="2.5" fill="#4db8ff"/>
        <circle cx="347" cy="80" r="2.5" fill="#4db8ff"/>

        <text x="180" y="60" font-size="26" font-weight="200" letter-spacing="9"
              text-anchor="middle" fill="#d8eeff">DOUG ROSENBERG</text>
      </svg>
      <span class="card-label">19 — Treble &amp; bass clef</span>
    </div>


    <!-- ──────────────────────────────────────────── -->
    <!-- 20  H A I R P I N S                         -->
    <!--     crescendo < top-left                    -->
    <!--     diminuendo > bottom-right               -->
    <!--     dynamic marks from music notation       -->
    <!-- ──────────────────────────────────────────── -->
    <div class="card">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 108" width="360" height="108">

        <!-- Crescendo < — top-left (point left, opens right) -->
        <line x1="16" y1="32" x2="50" y2="14"
              stroke="#4db8ff" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="16" y1="32" x2="50" y2="50"
              stroke="#4db8ff" stroke-width="1.5" stroke-linecap="round"/>

        <!-- Diminuendo > — bottom-right (opens left, point right) -->
        <line x1="344" y1="76" x2="310" y2="58"
              stroke="#4db8ff" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="344" y1="76" x2="310" y2="94"
              stroke="#4db8ff" stroke-width="1.5" stroke-linecap="round"/>

        <text x="180" y="60" font-size="26" font-weight="200" letter-spacing="9"
              text-anchor="middle" fill="#d8eeff">DOUG ROSENBERG</text>
      </svg>
      <span class="card-label">20 — Crescendo &amp; diminuendo</span>
    </div>


  </div>
</body>
</html>
