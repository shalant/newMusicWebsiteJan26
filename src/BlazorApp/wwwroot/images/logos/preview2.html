<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Logo Prototypes — Batch 2 — Doug Rosenberg</title>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #03080f;
      font-family: 'Josefin Sans', sans-serif;
      padding: 3rem 2rem 5rem;
      color: #88b8d8;
    }

    nav {
      text-align: center;
      margin-bottom: 2rem;
    }

    nav a {
      color: #4db8ff;
      font-size: 0.65rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-decoration: none;
      opacity: 0.55;
    }

    nav a:hover { opacity: 1; }

    h1 {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 200;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #4db8ff;
      opacity: 0.6;
      margin-bottom: 3.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: #060f1e;
      border: 1px solid rgba(77,184,255,0.15);
      border-radius: 6px;
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    .card-label {
      font-size: 0.62rem;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #4db8ff;
      opacity: 0.5;
    }

    svg text { font-family: 'Josefin Sans', sans-serif; }
  </style>
</head>
<body>

  <nav style="display:flex;justify-content:center;gap:2rem">
    <a href="preview.html">← Batch 1</a>
    <a href="preview3.html">Batch 3 →</a>
  </nav>
  <h1>Logo Prototypes · Batch 2</h1>

  <div class="grid">

    <!-- ─────────────────────────────────────────── -->
    <!-- 06  F I L M   S T R I P                    -->
    <!-- ─────────────────────────────────────────── -->
    <div class="card">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 122" width="420" height="122">

        <!-- strip background -->
        <rect width="420" height="122" fill="#060f1e"/>

        <!-- top & bottom band -->
        <rect x="0" y="0"   width="420" height="22" fill="#020408"/>
        <rect x="0" y="100" width="420" height="22" fill="#020408"/>

        <!-- sprocket holes — top row (14 holes, 14 px wide, 9 px tall) -->
        <rect x="8"   y="6" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="37"  y="6" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="66"  y="6" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="95"  y="6" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="124" y="6" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="153" y="6" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="182" y="6" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="211" y="6" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="240" y="6" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="269" y="6" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="298" y="6" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="327" y="6" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="356" y="6" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="385" y="6" width="14" height="10" rx="2.5" fill="#060f1e"/>

        <!-- sprocket holes — bottom row -->
        <rect x="8"   y="106" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="37"  y="106" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="66"  y="106" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="95"  y="106" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="124" y="106" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="153" y="106" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="182" y="106" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="211" y="106" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="240" y="106" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="269" y="106" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="298" y="106" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="327" y="106" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="356" y="106" width="14" height="10" rx="2.5" fill="#060f1e"/>
        <rect x="385" y="106" width="14" height="10" rx="2.5" fill="#060f1e"/>

        <!-- content area border lines -->
        <line x1="0" y1="22" x2="420" y2="22" stroke="#4db8ff" stroke-width="0.4" opacity="0.25"/>
        <line x1="0" y1="100" x2="420" y2="100" stroke="#4db8ff" stroke-width="0.4" opacity="0.25"/>

        <!-- DOUG -->
        <text x="210" y="54" font-size="17" font-weight="100" letter-spacing="15" text-anchor="middle" fill="#d8eeff">DOUG</text>

        <!-- rule -->
        <line x1="122" y1="63" x2="298" y2="63" stroke="#4db8ff" stroke-width="0.75"/>

        <!-- ROSENBERG -->
        <text x="210" y="86" font-size="21" font-weight="300" letter-spacing="7" text-anchor="middle" fill="#d8eeff">ROSENBERG</text>

      </svg>
      <span class="card-label">06 — Film Strip</span>
    </div>


    <!-- ─────────────────────────────────────────── -->
    <!-- 07  D I A M O N D   M O N O G R A M        -->
    <!-- ─────────────────────────────────────────── -->
    <div class="card">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">

        <!-- Outer diamond -->
        <polygon points="110,10 210,110 110,210 10,110"
                 fill="none" stroke="#4db8ff" stroke-width="1.2"/>

        <!-- Inner diamond (hairline) -->
        <polygon points="110,22 198,110 110,198 22,110"
                 fill="none" stroke="#4db8ff" stroke-width="0.35" opacity="0.3"/>

        <!-- Art deco corner notches — top -->
        <line x1="96"  y1="10" x2="124" y2="10" stroke="#4db8ff" stroke-width="1.2"/>
        <line x1="100" y1="16" x2="120" y2="16" stroke="#4db8ff" stroke-width="0.5" opacity="0.45"/>

        <!-- right -->
        <line x1="210" y1="96"  x2="210" y2="124" stroke="#4db8ff" stroke-width="1.2"/>
        <line x1="204" y1="100" x2="204" y2="120" stroke="#4db8ff" stroke-width="0.5" opacity="0.45"/>

        <!-- bottom -->
        <line x1="96"  y1="210" x2="124" y2="210" stroke="#4db8ff" stroke-width="1.2"/>
        <line x1="100" y1="204" x2="120" y2="204" stroke="#4db8ff" stroke-width="0.5" opacity="0.45"/>

        <!-- left -->
        <line x1="10" y1="96"  x2="10" y2="124" stroke="#4db8ff" stroke-width="1.2"/>
        <line x1="16" y1="100" x2="16" y2="120" stroke="#4db8ff" stroke-width="0.5" opacity="0.45"/>

        <!-- Cross hairlines through center (very faint) -->
        <line x1="110" y1="22" x2="110" y2="198" stroke="#4db8ff" stroke-width="0.3" opacity="0.15"/>
        <line x1="22"  y1="110" x2="198" y2="110" stroke="#4db8ff" stroke-width="0.3" opacity="0.15"/>

        <!-- DR -->
        <text x="110" y="127" font-size="66" font-weight="300" letter-spacing="5"
              text-anchor="middle" fill="#d8eeff">DR</text>

      </svg>
      <span class="card-label">07 — Diamond Monogram</span>
    </div>


    <!-- ─────────────────────────────────────────── -->
    <!-- 08  S O U N D   B A R S                    -->
    <!-- ─────────────────────────────────────────── -->
    <div class="card">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 195" width="320" height="195">

        <defs>
          <linearGradient id="bar-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#78ccff"/>
            <stop offset="100%" stop-color="#4db8ff" stop-opacity="0.25"/>
          </linearGradient>
        </defs>

        <!-- 7 bars — baseline at y=118 -->
        <!-- x positions (bar width 28, gap 10): 32 70 108 146 184 222 260 -->
        <rect x="32"  y="66" width="28" height="52" rx="1.5" fill="url(#bar-grad)"/>
        <rect x="70"  y="36" width="28" height="82" rx="1.5" fill="url(#bar-grad)"/>
        <rect x="108" y="54" width="28" height="64" rx="1.5" fill="url(#bar-grad)"/>
        <rect x="146" y="18" width="28" height="100" rx="1.5" fill="url(#bar-grad)"/>
        <rect x="184" y="48" width="28" height="70" rx="1.5" fill="url(#bar-grad)"/>
        <rect x="222" y="72" width="28" height="46" rx="1.5" fill="url(#bar-grad)"/>
        <rect x="260" y="84" width="28" height="34" rx="1.5" fill="url(#bar-grad)"/>

        <!-- baseline rule -->
        <line x1="28" y1="122" x2="292" y2="122" stroke="#4db8ff" stroke-width="0.8" opacity="0.45"/>

        <!-- ROSENBERG -->
        <text x="160" y="153" font-size="27" font-weight="300" letter-spacing="8"
              text-anchor="middle" fill="#d8eeff">ROSENBERG</text>

        <!-- rule + tagline -->
        <line x1="68" y1="163" x2="252" y2="163" stroke="#4db8ff" stroke-width="0.5" opacity="0.35"/>
        <text x="160" y="182" font-size="9.5" font-weight="200" letter-spacing="4.5"
              text-anchor="middle" fill="#4db8ff" opacity="0.65">DOUG  ·  SAXOPHONE  ·  JAZZ</text>

      </svg>
      <span class="card-label">08 — Sound Bars</span>
    </div>


    <!-- ─────────────────────────────────────────── -->
    <!-- 09  C I R C U L A R   S T A M P            -->
    <!-- ─────────────────────────────────────────── -->
    <div class="card">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">

        <defs>
          <!-- Top arc: CCW from left to right over the top (text baseline on outside-top) -->
          <path id="outer-top"
                d="M 47,160 A 113,113 0 0,0 273,160"/>
          <!-- Bottom arc: CW from left to right under the bottom (text baseline on inside-bottom) -->
          <path id="inner-bottom"
                d="M 58,160 A 102,102 0 0,1 262,160"/>
        </defs>

        <!-- Outer decorative rings -->
        <circle cx="160" cy="160" r="138" fill="none" stroke="#4db8ff" stroke-width="1"   opacity="0.48"/>
        <circle cx="160" cy="160" r="131" fill="none" stroke="#4db8ff" stroke-width="0.3" opacity="0.25"/>

        <!-- Diamond markers at 3 and 9 o'clock -->
        <rect x="9"  y="156" width="8" height="8" transform="rotate(45,13,160)"  fill="#4db8ff" opacity="0.7"/>
        <rect x="303" y="156" width="8" height="8" transform="rotate(45,307,160)" fill="#4db8ff" opacity="0.7"/>

        <!-- Top arc text: DOUG ROSENBERG -->
        <text font-size="11" font-weight="200" letter-spacing="4.5" fill="#88b8d8" opacity="0.9">
          <textPath href="#outer-top" startOffset="50%" text-anchor="middle">DOUG ROSENBERG</textPath>
        </text>

        <!-- Inner disc -->
        <circle cx="160" cy="160" r="108" fill="none" stroke="#4db8ff" stroke-width="0.35" opacity="0.28"/>
        <circle cx="160" cy="160" r="78"  fill="#0b1828"/>
        <circle cx="160" cy="160" r="78"  fill="none" stroke="#4db8ff" stroke-width="1"   opacity="0.55"/>
        <circle cx="160" cy="160" r="72"  fill="none" stroke="#4db8ff" stroke-width="0.3" opacity="0.28"/>

        <!-- DR monogram -->
        <text x="160" y="177" font-size="52" font-weight="300" letter-spacing="6"
              text-anchor="middle" fill="#4db8ff">DR</text>

        <!-- Bottom arc text: SAXOPHONE inside the lower arc -->
        <text font-size="10" font-weight="200" letter-spacing="4" fill="#4db8ff" opacity="0.68">
          <textPath href="#inner-bottom" startOffset="50%" text-anchor="middle">SAXOPHONE  ·  JAZZ</textPath>
        </text>

      </svg>
      <span class="card-label">09 — Circular Stamp</span>
    </div>


    <!-- ─────────────────────────────────────────── -->
    <!-- 10  S T A F F   +   N O T E               -->
    <!-- ─────────────────────────────────────────── -->
    <div class="card">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 188" width="340" height="188">

        <!-- 5 staff lines -->
        <line x1="44" y1="28"  x2="296" y2="28"  stroke="#d8eeff" stroke-width="0.9" opacity="0.3"/>
        <line x1="44" y1="42"  x2="296" y2="42"  stroke="#d8eeff" stroke-width="0.9" opacity="0.3"/>
        <line x1="44" y1="56"  x2="296" y2="56"  stroke="#d8eeff" stroke-width="0.9" opacity="0.3"/>
        <line x1="44" y1="70"  x2="296" y2="70"  stroke="#d8eeff" stroke-width="0.9" opacity="0.3"/>
        <line x1="44" y1="84"  x2="296" y2="84"  stroke="#d8eeff" stroke-width="0.9" opacity="0.3"/>

        <!-- Ledger / bar lines at ends -->
        <line x1="44"  y1="24" x2="44"  y2="88" stroke="#d8eeff" stroke-width="1" opacity="0.3"/>
        <line x1="296" y1="24" x2="296" y2="88" stroke="#d8eeff" stroke-width="1" opacity="0.3"/>

        <!-- Quarter note — head between 3rd and 4th line (cy ≈ 63) -->
        <ellipse cx="182" cy="63" rx="11.5" ry="8.5"
                 transform="rotate(-20, 182, 63)"
                 fill="#4db8ff"/>

        <!-- Stem up from note head right edge -->
        <line x1="193" y1="58" x2="193" y2="14"
              stroke="#4db8ff" stroke-width="2.2" stroke-linecap="round"/>

        <!-- Second note — higher pitch, adding musical movement -->
        <ellipse cx="232" cy="42" rx="11.5" ry="8.5"
                 transform="rotate(-20, 232, 42)"
                 fill="#4db8ff" opacity="0.45"/>
        <line x1="243" y1="37" x2="243" y2="14"
              stroke="#4db8ff" stroke-width="2.2" stroke-linecap="round" opacity="0.45"/>

        <!-- Beam connecting the two notes -->
        <line x1="193" y1="14" x2="243" y2="14"
              stroke="#4db8ff" stroke-width="3" stroke-linecap="square" opacity="0.65"/>

        <!-- ROSENBERG -->
        <text x="170" y="130" font-size="28" font-weight="300" letter-spacing="8"
              text-anchor="middle" fill="#d8eeff">ROSENBERG</text>

        <!-- rule -->
        <line x1="58" y1="142" x2="282" y2="142"
              stroke="#4db8ff" stroke-width="0.5" opacity="0.4"/>

        <!-- tagline -->
        <text x="170" y="162" font-size="10" font-weight="200" letter-spacing="5"
              text-anchor="middle" fill="#4db8ff" opacity="0.65">DOUG  ·  SAXOPHONE  ·  JAZZ</text>

      </svg>
      <span class="card-label">10 — Staff &amp; Notes</span>
    </div>

  </div>
</body>
</html>
