<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;300;400&display=swap');
  </style>

  <!-- Background -->
  <rect width="320" height="320" fill="#060f1e"/>

  <!-- Outer record edge -->
  <circle cx="160" cy="160" r="140" fill="#0a0a14" stroke="#d8eeff" stroke-width="1.5"/>

  <!-- Groove rings — varying opacity for depth -->
  <circle cx="160" cy="160" r="128" fill="none" stroke="#d8eeff" stroke-width="0.5" opacity="0.22"/>
  <circle cx="160" cy="160" r="115" fill="none" stroke="#d8eeff" stroke-width="0.5" opacity="0.18"/>
  <circle cx="160" cy="160" r="102" fill="none" stroke="#d8eeff" stroke-width="0.5" opacity="0.15"/>
  <circle cx="160" cy="160" r="89"  fill="none" stroke="#d8eeff" stroke-width="0.5" opacity="0.13"/>
  <circle cx="160" cy="160" r="76"  fill="none" stroke="#d8eeff" stroke-width="0.5" opacity="0.11"/>

  <!-- Label circle -->
  <circle cx="160" cy="160" r="58" fill="#0d1e36" stroke="#4db8ff" stroke-width="1.2"/>

  <!-- Label inner ring -->
  <circle cx="160" cy="160" r="50" fill="none" stroke="#4db8ff" stroke-width="0.4" opacity="0.45"/>

  <!-- DR text on label -->
  <text
    x="160" y="170"
    font-family="'Josefin Sans', sans-serif"
    font-size="36"
    font-weight="300"
    letter-spacing="6"
    text-anchor="middle"
    fill="#4db8ff">DR</text>

  <!-- Center spindle hole -->
  <circle cx="160" cy="160" r="4" fill="#060f1e" stroke="#4db8ff" stroke-width="1"/>

  <!-- Name arc — bottom of record, small type -->
  <text
    x="160" y="290"
    font-family="'Josefin Sans', sans-serif"
    font-size="11"
    font-weight="200"
    letter-spacing="5"
    text-anchor="middle"
    fill="#88b8d8"
    opacity="0.65">DOUG ROSENBERG</text>
</svg>
