<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;300;400&display=swap');
  </style>

  <!-- Background -->
  <rect width="280" height="280" fill="#060f1e"/>

  <!-- Art deco sunburst rays — 24 rays every 15 degrees -->
  <g stroke="#4db8ff" stroke-width="0.7" opacity="0.28">
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(0,   140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(15,  140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(30,  140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(45,  140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(60,  140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(75,  140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(90,  140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(105, 140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(120, 140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(135, 140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(150, 140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(165, 140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(180, 140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(195, 140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(210, 140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(225, 140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(240, 140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(255, 140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(270, 140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(285, 140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(300, 140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(315, 140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(330, 140,140)"/>
    <line x1="140" y1="140" x2="140" y2="16"  transform="rotate(345, 140,140)"/>
  </g>

  <!-- Outer ring -->
  <circle cx="140" cy="140" r="122" fill="none" stroke="#4db8ff" stroke-width="1" opacity="0.5"/>

  <!-- Second ring -->
  <circle cx="140" cy="140" r="114" fill="none" stroke="#4db8ff" stroke-width="0.4" opacity="0.3"/>

  <!-- Inner filled circle (white card) -->
  <circle cx="140" cy="140" r="88" fill="#0d1e36"/>

  <!-- Inner ring -->
  <circle cx="140" cy="140" r="88" fill="none" stroke="#4db8ff" stroke-width="1" opacity="0.6"/>
  <circle cx="140" cy="140" r="82" fill="none" stroke="#4db8ff" stroke-width="0.35" opacity="0.3"/>

  <!-- DOUG — top half -->
  <text
    x="140" y="127"
    font-family="'Josefin Sans', sans-serif"
    font-size="18"
    font-weight="200"
    letter-spacing="10"
    text-anchor="middle"
    fill="#88b8d8"
    opacity="0.85">DOUG</text>

  <!-- Thin rule -->
  <line x1="96" y1="137" x2="184" y2="137" stroke="#4db8ff" stroke-width="0.8"/>

  <!-- ROSENBERG — main -->
  <text
    x="140" y="160"
    font-family="'Josefin Sans', sans-serif"
    font-size="22"
    font-weight="300"
    letter-spacing="5"
    text-anchor="middle"
    fill="#d8eeff">ROSENBERG</text>

  <!-- Thin rule -->
  <line x1="96" y1="168" x2="184" y2="168" stroke="#4db8ff" stroke-width="0.8"/>

  <!-- Tagline -->
  <text
    x="140" y="183"
    font-family="'Josefin Sans', sans-serif"
    font-size="9"
    font-weight="200"
    letter-spacing="4"
    text-anchor="middle"
    fill="#4db8ff"
    opacity="0.75">SAXOPHONE</text>

  <!-- Center dot -->
  <circle cx="140" cy="140" r="2.5" fill="#4db8ff" opacity="0.4"/>
</svg>
