<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="480" height="180">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;300;400&display=swap');
  </style>

  <!-- Background -->
  <rect width="480" height="180" fill="#060f1e"/>

  <!-- DOUG — ultra thin, wide tracking -->
  <text
    x="240" y="72"
    font-family="'Josefin Sans', sans-serif"
    font-size="58"
    font-weight="100"
    letter-spacing="24"
    text-anchor="middle"
    fill="#d8eeff">DOUG</text>

  <!-- Rule with accent dots -->
  <line x1="60" y1="90" x2="420" y2="90" stroke="#4db8ff" stroke-width="0.8"/>
  <circle cx="60"  cy="90" r="2.5" fill="#4db8ff"/>
  <circle cx="420" cy="90" r="2.5" fill="#4db8ff"/>

  <!-- ROSENBERG — light weight, tighter -->
  <text
    x="240" y="135"
    font-family="'Josefin Sans', sans-serif"
    font-size="34"
    font-weight="300"
    letter-spacing="10"
    text-anchor="middle"
    fill="#d8eeff">ROSENBERG</text>

  <!-- Tagline -->
  <text
    x="240" y="162"
    font-family="'Josefin Sans', sans-serif"
    font-size="10"
    font-weight="200"
    letter-spacing="5.5"
    text-anchor="middle"
    fill="#4db8ff"
    opacity="0.75">SAXOPHONE  ·  JAZZ</text>
</svg>
