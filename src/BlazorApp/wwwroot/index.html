<html lang="en">

<head>
    <meta charset="utf-8" />

    <base href="https://shalant.github.io/newMusicWebsiteJan26/" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;300;400&display=swap" rel="stylesheet" />

    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <script>
        // https://blog.elmah.io/how-to-fix-blazor-wasm-base-path-problems/
        var path = window.location.pathname.split('/');
        var base = document.getElementsByTagName('base')[0];
        if (window.location.host.includes('localhost')) {
            base.setAttribute('href', '/');
        } else if (path.length > 2) {
            base.setAttribute('href', '/' + path[1] + '/');
        } else if (path[path.length - 1].length != 0) {
            window.location.replace(window.location.origin + window.location.pathname + '/' + window.location.search);
        }
    </script>
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BlazorApp.styles.css" rel="stylesheet" />
    <script type="module">
        import { initializeTheme, applyTheme, getStoredTheme } from './js/theme.js';
        window.initializeTheme = initializeTheme;
        window.applyTheme = applyTheme;
        window.getStoredTheme = getStoredTheme;
        initializeTheme();
    </script>
</head>

<body>
    <a href="#home" class="skip-link">Skip to content</a>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <!--<script src="@Assets[" _content /MudBlazor/MudBlazor.min.js"]"></script>-->
    <!--<script src="@Assets[" _content /MudBlazor/MudBlazor.min.js"]"></script>-->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        (function () {
            // Shrink nav on scroll
            window.addEventListener('scroll', function () {
                var header = document.getElementById('header');
                if (!header) return;
                header.classList.toggle('scrolled', window.scrollY > 60);
            }, { passive: true });

            // Hero parallax — subtle depth effect (Immersive trend)
            (function () {
                var heroImg = null;
                function getHeroImg() {
                    if (!heroImg) heroImg = document.querySelector('#home .hero-image');
                    return heroImg;
                }
                window.addEventListener('scroll', function () {
                    var img = getHeroImg();
                    if (!img) return;
                    var scrollY = window.pageYOffset;
                    var sectionH = window.innerHeight;
                    if (scrollY < sectionH) {
                        img.style.transform = 'translateY(' + Math.round(scrollY * 0.22) + 'px)';
                    }
                }, { passive: true });
            }());

            // Active nav link highlight based on scroll position
            window.addEventListener('scroll', function () {
                var sections = document.querySelectorAll('section[id]');
                var navLinks = document.querySelectorAll('.nav-links a');
                if (!navLinks.length) return;
                var scrollY = window.pageYOffset + 90;
                sections.forEach(function (section) {
                    var top = section.offsetTop;
                    var height = section.clientHeight;
                    if (scrollY >= top && scrollY < top + height) {
                        navLinks.forEach(function (link) {
                            link.classList.toggle('active', link.getAttribute('href') === '#' + section.id);
                        });
                    }
                });
            }, { passive: true });

            // Scroll reveal — uses IntersectionObserver + MutationObserver
            // MutationObserver handles Blazor WASM async rendering
            var revealIO = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        revealIO.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.07, rootMargin: '0px 0px -36px 0px' });

            var mo = new MutationObserver(function () {
                document.querySelectorAll('.reveal:not(.observed)').forEach(function (el) {
                    el.classList.add('observed');
                    revealIO.observe(el);
                });
            });
            mo.observe(document.body, { childList: true, subtree: true });
        })();
    </script>
</body>

</html>
